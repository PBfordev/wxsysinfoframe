name: Build on Linux

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/build-msvs.yml'
      - '.github/workflows/build-msys2.yml'
      - '.github/workflows/build-macos.yml'
      - 'ReadMe.md'
      - 'screenshots/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/build-msvs.yml'
      - '.github/workflows/build-msys2.yml'
      - '.github/workflows/build-macos.yml'
      - 'ReadMe.md'
      - 'screenshots/**'
  workflow_dispatch:

permissions:
  contents: read

# cancel the runs for the previous pushes to a pull request,
# runs for pushes to master are grouped by commit so none is skipped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_DIR_PATH: build_cmake

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # The latest wxWidgets packaged for the distribution (3.2 for Ubuntu 24.04),
    # wxWidgets is not built here.
    - name: Install wxWidgets and build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libgtk-3-dev libwxgtk3.2-dev

    - name: Configure
      run: |
        cmake -G Ninja -B $BUILD_DIR_PATH -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build $BUILD_DIR_PATH

    # The application writes the system information to a file, which is then shown in the log.
    # There is no display on the runner, so a virtual one (already installed) is used.
    - name: Show system information
      timeout-minutes: 2
      run: |
        dump="$RUNNER_TEMP/sysinfo.txt"
        status=0
        xvfb-run -a ./$BUILD_DIR_PATH/wxSysInfoFrameTest --dump="$dump" || status=$?
        echo "::group::System information"
        cat "$dump" || echo "No output was written."
        echo "::endgroup::"
        exit $status
